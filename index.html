<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFRMS | Restaurant Management</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <section id="login-screen" class="login-screen">
        <form id="login-form" class="login-panel">
            <div class="logo login-logo">
                <i data-lucide="utensils"></i>
                <span>AFRMS</span>
            </div>
            <h1>Staff Login</h1>
            <label>
                Username
                <input id="username" type="text" autocomplete="username" value="demo">
            </label>
            <label>
                Password
                <input id="password" type="password" autocomplete="current-password" value="demo">
            </label>
            <button type="submit" class="primary-btn">Sign In</button>
            <p id="login-error" class="error-text"></p>
        </form>
    </section>

    <nav class="sidebar" hidden>
        <div class="logo">
            <i data-lucide="utensils"></i>
            <span>AIU Frontgate</span>
        </div>
        <ul class="nav-links">
            <li><a class="nav-item active" data-view="dashboard"><i data-lucide="layout-dashboard"></i> <span>Dashboard</span></a></li>
            <li><a class="nav-item" data-view="menu"><i data-lucide="book-open"></i> <span>Menu</span></a></li>
            <li><a class="nav-item" data-view="pos"><i data-lucide="shopping-cart"></i> <span>Point of Sale</span></a></li>
            <li><a class="nav-item" data-view="orders"><i data-lucide="chef-hat"></i> <span>Kitchen Orders</span></a></li>
            <li><a class="nav-item" data-view="inventory"><i data-lucide="package-check"></i> <span>Inventory</span></a></li>
            <li><a class="nav-item" data-view="reports"><i data-lucide="bar-chart-3"></i> <span>Reports</span></a></li>
            <li><a class="nav-item" data-view="audit"><i data-lucide="shield-check"></i> <span>Audit Log</span></a></li>
            <li><a class="nav-item" data-view="settings"><i data-lucide="settings"></i> <span>Settings</span></a></li>
        </ul>
    </nav>

    <main id="main-content" hidden>
        <header>
            <div class="search-bar">
                <i data-lucide="search"></i>
                <input id="global-search" type="text" placeholder="Search menu, orders, inventory">
            </div>
            <div class="user-profile">
                <div class="user-info">
                    <p id="current-user-name">-</p>
                    <p id="current-user-role">-</p>
                </div>
                <button id="logout-btn" class="icon-btn" title="Logout"><i data-lucide="log-out"></i></button>
            </div>
        </header>

        <div id="view-container"></div>
    </main>

    <template id="dashboard-template">
        <div class="animate-in">
            <div class="page-title">
                <h1>Real-Time Sales Dashboard</h1>
                <span id="dashboard-clock"></span>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><p class="stat-label">Revenue Today</p><p class="stat-value" id="stat-revenue">฿0.00</p></div>
                <div class="stat-card"><p class="stat-label">Orders Today</p><p class="stat-value" id="stat-orders">0</p></div>
                <div class="stat-card"><p class="stat-label">Estimated Profit</p><p class="stat-value" id="stat-profit">฿0.00</p></div>
                <div class="stat-card"><p class="stat-label">Low Stock Items</p><p class="stat-value" id="stat-low-stock">0</p></div>
            </div>
            <section class="split-layout">
                <div>
                    <h2>Recent Orders</h2>
                    <div id="recent-orders-list" class="list-panel"></div>
                </div>
                <div>
                    <h2>Low Stock Alerts</h2>
                    <div id="low-stock-list" class="list-panel"></div>
                </div>
            </section>
        </div>
    </template>

    <template id="menu-template">
        <div class="animate-in">
            <div class="page-title">
                <h1>Shop Menu & Recipe Configuration</h1>
                <button id="menu-save-btn" class="secondary-btn"><i data-lucide="save"></i> Save Menu Snapshot</button>
            </div>
            <div class="category-filters" id="category-filters"></div>
            <div class="menu-grid" id="menu-grid"></div>
        </div>
    </template>

    <template id="pos-template">
        <div class="animate-in">
            <h1>Point of Sale</h1>
            <div class="pos-container">
                <div class="menu-grid" id="pos-menu-grid"></div>
                <div class="cart-panel">
                    <div class="cart-header">Current Order</div>
                    <div class="cart-items" id="cart-items"></div>
                    <div class="cart-total">
                        <div class="total-row"><span>Subtotal</span><span id="cart-subtotal">฿0.00</span></div>
                        <div class="total-row"><span>VAT (7%)</span><span id="cart-tax">฿0.00</span></div>
                        <div class="total-row grand-total"><span>Total</span><span id="cart-total-price">฿0.00</span></div>
                        <label>
                            Payment Amount (THB)
                            <input id="payment-amount" type="number" min="0" step="0.01" placeholder="0.00">
                        </label>
                        <button class="primary-btn" id="checkout-btn"><i data-lucide="receipt"></i> Process Payment</button>
                        <p id="pos-message" class="message-text"></p>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="orders-template">
        <div class="animate-in">
            <h1>Kitchen Preparation Queue</h1>
            <div class="menu-grid" id="live-orders-grid"></div>
        </div>
    </template>

    <template id="inventory-template">
        <div class="animate-in">
            <div class="page-title">
                <h1>Inventory Management</h1>
                <span class="pill">Supplier deliveries and admin adjustments</span>
            </div>
            <form id="stock-form" class="control-panel">
                <select id="stock-ingredient"></select>
                <input id="stock-amount" type="number" step="0.01" placeholder="Quantity">
                <select id="stock-action">
                    <option value="ADD">Supplier Delivery</option>
                    <option value="ADJUST">Manual Adjustment</option>
                </select>
                <input id="stock-note" type="text" placeholder="Justification">
                <button class="primary-btn" type="submit"><i data-lucide="plus"></i> Record Stock</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Ingredient</th><th>Current Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
                    <tbody id="inventory-table"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="reports-template">
        <div class="animate-in">
            <h1>Daily Sales Report</h1>
            <div class="stats-grid">
                <div class="stat-card"><p class="stat-label">Revenue</p><p class="stat-value" id="report-revenue">฿0.00</p></div>
                <div class="stat-card"><p class="stat-label">Cost</p><p class="stat-value" id="report-cost">฿0.00</p></div>
                <div class="stat-card"><p class="stat-label">Profit</p><p class="stat-value" id="report-profit">฿0.00</p></div>
                <div class="stat-card"><p class="stat-label">Average Order</p><p class="stat-value" id="report-average">฿0.00</p></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Order ID</th><th>User ID</th><th>Items</th><th>Status</th><th>Total</th></tr></thead>
                    <tbody id="report-table"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="audit-template">
        <div class="animate-in">
            <h1>Immutable Audit Log</h1>
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Justification</th></tr></thead>
                    <tbody id="audit-table"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="settings-template">
        <div class="animate-in">
            <h1>RBAC Settings</h1>
            <div id="role-matrix" class="list-panel"></div>
        </div>
    </template>

    <script type="module" src="js/app.js"></script>
</body>
</html>
